<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#183c2c">
<title>Краснолесье | Виштынецкий экомузей</title>
<meta name="description" content="Добро пожаловать в Краснолесье. Переход на сайт Виштынецкого экомузея.">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#456b4a,#183c2c 75%);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}
main{width:min(100%,540px);text-align:center;padding:42px 24px;border:1px solid #ffffff30;border-radius:24px;background:#ffffff12;box-shadow:0 18px 65px #091f1680;backdrop-filter:blur(6px)}
.mark{font-size:42px;margin-bottom:12px}h1{font-size:clamp(27px,6vw,40px);line-height:1.15;margin:0 0 10px}h2{font-size:18px;font-weight:500;margin:0 0 22px;color:#d6e7d6}p{color:#e0eee2;margin:0 0 24px}
a{display:inline-block;background:#fff;color:#183c2c;padding:14px 26px;border-radius:12px;font-weight:750;text-decoration:none}a:hover{background:#e4f0df}a:focus-visible{outline:3px solid #ffdf83;outline-offset:4px}
small{display:block;margin-top:22px;color:#d3e5d8}.notice{margin:22px auto 0;max-width:420px;padding:16px;border-radius:12px;background:#ffffff15;border:1px solid #ffffff25}.notice[hidden]{display:none}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">🌲</div>
<h1>Добро пожаловать в Краснолесье</h1>
<h2>Виштынецкий экомузей</h2>
<p>История, природа и удивительные места Виштынецкого края.</p>
<a id="go" href="https://vishtynets.ru/">Перейти на сайт музея →</a>
<div id="notice" class="notice" hidden><strong id="notice-title"></strong><p id="notice-text" style="margin:8px 0 0"></p></div>
<small id="timer" aria-live="off">Автоматический переход через 3 секунды</small>
</main>
<script>
"use strict";
const config={redirectUrl:"https://vishtynets.ru/",seconds:3,announcement:{enabled:false,title:"",text:""}};
const notice=document.getElementById("notice");
if(config.announcement.enabled&&config.announcement.title){
 document.getElementById("notice-title").textContent=config.announcement.title;
 document.getElementById("notice-text").textContent=config.announcement.text;
 notice.hidden=false;
}
let remaining=Math.max(0,Math.floor(config.seconds));
const timer=document.getElementById("timer");
function tick(){
 if(remaining<=0){location.replace(config.redirectUrl);return;}
 timer.textContent="Автоматический переход через "+remaining+" сек.";
 remaining-=1;setTimeout(tick,1000);
}
tick();
</script>
</body>
</html>
