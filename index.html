<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Краснолесье — Виштынецкий экомузей</title>
  <meta name="description" content="Переход на официальный сайт Виштынецкого экомузея.">
  <meta http-equiv="refresh" content="3;url=https://vishtynets.ru/">
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5ef;color:#203529;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(92%,560px);padding:42px 30px;text-align:center;background:#fff;border-radius:20px;box-shadow:0 12px 40px #172f2012}
    h1{font-size:clamp(24px,5vw,34px);line-height:1.2;margin:0 0 16px}
    p{margin:0 0 22px;color:#4b5b50}
    a{display:inline-block;padding:12px 22px;border-radius:10px;background:#275d40;color:white;text-decoration:none;font-weight:650}
    a:focus-visible{outline:3px solid #c49328;outline-offset:3px}
    small{display:block;margin-top:20px;color:#617267}
  </style>
</head>
<body>
  <main>
    <h1>Добро пожаловать в Краснолесье!</h1>
    <p>Вы переходите на сайт Виштынецкого экомузея.</p>
    <a href="https://vishtynets.ru/">Перейти на сайт музея</a>
    <small>Автоматический переход через 3 секунды</small>
  </main>
  <script>
    window.setTimeout(function () { window.location.replace("https://vishtynets.ru/"); }, 3000);
  </script>
</body>
</html>
